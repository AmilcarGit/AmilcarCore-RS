[workspace]
resolver = "2"
members = ["crates/amilcar-core", "crates/amilcar-fs", "crates/amilcar-data", "crates/amilcar-cli"]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["AmilcarGit"]
repository = "https://github.com/AmilcarGit/AmilcarCore-RS"
[workspace.dependencies]
amilcar-core = { path = "crates/amilcar-core" }
amilcar-fs = { path = "crates/amilcar-fs" }
amilcar-data = { path = "crates/amilcar-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
