<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">AmilcarCore-RS terminal demonstration</title><desc id="d">Animated terminal panels showing the real info output and documented file command examples.</desc><style>.bg{fill:#0d1117}.bar{fill:#202833}.mono{font:18px ui-monospace,monospace;fill:#e6edf3}.muted{font:14px ui-monospace,monospace;fill:#8b949e}.cyan{fill:#79c0ff}.green{fill:#7ee787}.frame{opacity:0;animation:show 10s infinite}.one{animation-delay:0s}.two{animation-delay:5s}@keyframes show{0%,5%{opacity:0}10%,45%{opacity:1}50%,100%{opacity:0}}</style><rect x="12" y="12" width="876" height="366" rx="18" class="bg" stroke="#30363d" stroke-width="2"/><path d="M12 30 Q12 12 30 12 H870 Q888 12 888 30 V58 H12Z" class="bar"/><circle cx="38" cy="35" r="6" fill="#ff5f56"/><circle cx="60" cy="35" r="6" fill="#ffbd2e"/><circle cx="82" cy="35" r="6" fill="#27c93f"/><text x="450" y="40" text-anchor="middle" class="muted">AMILCARCORE-RS · TERMINAL</text><g class="frame one"><text x="48" y="112" class="mono cyan">$ amilcar info</text><text x="48" y="160" class="mono">AmilcarCore-RS 0.1.0</text><text x="48" y="204" class="mono">Maximum inspected file size: 67108864 bytes</text><text x="48" y="248" class="mono green">Execution mode: local</text></g><g class="frame two"><text x="48" y="112" class="mono cyan">$ amilcar file inspect ./documento.txt</text><text x="48" y="160" class="mono">Path: ./documento.txt</text><text x="48" y="204" class="mono">Type: file</text><text x="48" y="248" class="mono">Size: (metadata reported by the actual file)</text><text x="48" y="300" class="muted">The result depends on the file inspected on your device.</text></g><text x="48" y="348" class="muted">Rust · local-first · buffered filesystem operations</text></svg>