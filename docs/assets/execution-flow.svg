<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Execution flow</title><desc id="d">User command flows through CLI, engine and local filesystem operations.</desc><defs><style>.n{fill:#111827;stroke:#475569;stroke-width:2}.h{font:bold 20px sans-serif;fill:#f8fafc}.p{font:15px sans-serif;fill:#cbd5e1}.l{stroke:#38bdf8;stroke-width:4;fill:none;stroke-linecap:round}</style></defs><rect width="1000" height="360" rx="24" fill="#080d18"/><g><rect x="35" y="115" width="190" height="120" rx="16" class="n"/><text x="130" y="162" text-anchor="middle" class="h">User</text><text x="130" y="190" text-anchor="middle" class="p">Terminal command</text><rect x="285" y="115" width="190" height="120" rx="16" class="n"/><text x="380" y="162" text-anchor="middle" class="h">CLI</text><text x="380" y="190" text-anchor="middle" class="p">Parse arguments</text><rect x="535" y="115" width="190" height="120" rx="16" class="n"/><text x="630" y="162" text-anchor="middle" class="h">Engine</text><text x="630" y="190" text-anchor="middle" class="p">Apply limits + API</text><rect x="785" y="115" width="180" height="120" rx="16" class="n"/><text x="875" y="162" text-anchor="middle" class="h">Local I/O</text><text x="875" y="190" text-anchor="middle" class="p">Read / inspect</text></g><path d="M225 175 H285 M475 175 H535 M725 175 H785" class="l"/><path d="M275 166 L285 175 L275 184 M525 166 L535 175 L525 184 M775 166 L785 175 L775 184" class="l"/><text x="500" y="300" text-anchor="middle" class="p">No remote API is required for these core operations.</text></svg>